<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>PresLink Arcade poster</title>
  <meta name="description" content="The PresLink Arcade poster: A3 and A4 for printing, a picture for social media and one for messages.">
  <link rel="icon" href="assets/icon.svg?v=5" type="image/svg+xml">
  <style>
    /* The poster in four formats, all drawn from this page (tools/posters.cjs saves them to posters/):
       ?f=a3 and ?f=a4 to print, ?f=social (1080 × 1350) for posts, ?f=message (1200 × 630) for messages and
       link previews. A3 is the original design. A4 is the same sheet shrunk by 1/√2, as the paper is: every
       print size is in "u", a millimetre on A3. &mode=honours swaps the prize words for the honours ones;
       &closes=12 December and &org=NAME (RCN 20000000) add the closing date and the organiser to the small print.
       The sheet is white and says little: the name, the headline, the price, the code, three photos, the promise.
       Purple marks PresLink and the school; nothing else is coloured. */
    /* Static weights: PDF printers embed them as ordinary TrueType. */
    @font-face { font-family: 'Inter'; font-weight: 500; font-display: block; src: url('fonts/static/inter-latin-500-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 600; font-display: block; src: url('fonts/static/inter-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 700; font-display: block; src: url('fonts/static/inter-latin-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 800; font-display: block; src: url('fonts/static/inter-latin-800-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 900; font-display: block; src: url('fonts/static/inter-latin-900-normal.woff2') format('woff2'); }
    :root {
      --ink: #1c1c1e;
      --muted: #6e6e73;
      --green: #1f9d5a;
      --purple: #5b3a9a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: #ededf0; color: var(--ink); font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    p, h1, figure { margin: 0; }

    /* ---------- The pieces, the same in every format ---------- */
    .sheet { position: relative; display: flex; flex-direction: column; overflow: hidden; background: #fff; transform-origin: top left; flex: none; }
    .sheet > * { flex-shrink: 0; }
    .top { display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; }
    .mark { display: block; width: auto; }
    .wordmark { color: var(--purple); font-weight: 800; letter-spacing: -.025em; line-height: 1; white-space: nowrap; }
    .wordmark span { color: var(--green); }
    .school { display: flex; align-items: center; }
    .school-name { color: var(--purple); font-weight: 600; letter-spacing: .005em; line-height: 1; white-space: nowrap; }
    .crest { display: block; width: auto; }
    .hero { text-align: center; }
    h1 { font-weight: 900; line-height: .95; letter-spacing: -.04em; }
    h1 .g { color: var(--purple); }
    .price { font-weight: 800; line-height: 1; letter-spacing: -.02em; }
    .scan { display: flex; flex-direction: column; align-items: center; }
    .scan-label { font-weight: 800; line-height: 1; letter-spacing: .08em; text-transform: uppercase; color: var(--purple); }
    .qr svg { display: block; width: 100%; height: 100%; }
    .url { font-weight: 800; line-height: 1.1; text-align: center; white-space: nowrap; }
    .stories { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stories figure { min-width: 0; }
    .stories img { display: block; width: 100%; object-fit: cover; background: #f2f2f4; }
    .stories figcaption { text-align: center; }
    .stories b { display: block; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
    .foot { text-align: center; }
    .promise { font-weight: 700; line-height: 1.3; text-wrap: balance; }
    .terms { color: var(--muted); font-weight: 500; line-height: 1.35; text-wrap: balance; }

    /* ---------- A3 and A4: the sheet in u ---------- */
    .print { --u: 1mm; }
    .print.a4 { --u: .70711mm; }
    .print .sheet { width: calc(297 * var(--u)); height: calc(420 * var(--u)); padding: calc(14 * var(--u)) calc(18 * var(--u)) calc(12 * var(--u)); }
    .print .top { height: calc(26 * var(--u)); }
    .print .brand { gap: calc(5 * var(--u)); }
    .print .mark { height: calc(26 * var(--u)); }
    .print .wordmark { font-size: calc(12 * var(--u)); }
    .print .school { gap: calc(5 * var(--u)); }
    .print .school-name { font-size: calc(4.3 * var(--u)); }
    .print .crest { height: calc(20 * var(--u)); }
    .print .hero { margin-top: calc(16 * var(--u)); }
    .print h1 { font-size: calc(25 * var(--u)); }
    .print .price { margin-top: calc(8 * var(--u)); font-size: calc(11 * var(--u)); }
    .print .scan { margin-top: calc(13 * var(--u)); }
    .print .scan-label { font-size: calc(9 * var(--u)); }
    .print .qr { width: calc(152 * var(--u)); height: calc(152 * var(--u)); margin-top: calc(3 * var(--u)); }
    .print .url { font-size: calc(11 * var(--u)); margin-top: calc(1 * var(--u)); }
    .print .stories { gap: calc(7 * var(--u)); margin-top: calc(12 * var(--u)); }
    .print .stories img { height: calc(50 * var(--u)); border-radius: calc(6 * var(--u)); }
    .print .stories figcaption { margin-top: calc(3 * var(--u)); }
    .print .stories b { font-size: calc(5.5 * var(--u)); color: var(--muted); }
    .print footer { margin-top: auto; }
    .print .promise { font-size: calc(4.8 * var(--u)); }
    .print .terms { margin-top: calc(2.5 * var(--u)); font-size: calc(3.2 * var(--u)); }

    /* ---------- Social: 1080 × 1350, the web address in the place of the code ---------- */
    .social .sheet { width: 1080px; height: 1350px; padding: 72px 78px 60px; }
    .social .top { height: 96px; }
    .social .brand { gap: 22px; }
    .social .mark { height: 96px; }
    .social .wordmark { font-size: 46px; }
    .social .school { gap: 20px; }
    .social .school-name { font-size: 19px; }
    .social .crest { height: 86px; }
    .social .hero { margin-top: 88px; }
    .social h1 { font-size: 108px; }
    .social .price { margin-top: 30px; font-size: 44px; }
    .social .scan { margin-top: 68px; }
    .social .scan-label { font-size: 30px; }
    .social .url { margin-top: 14px; font-size: 78px; font-weight: 900; letter-spacing: -.03em; color: var(--purple); }
    .social .stories { gap: 24px; margin-top: 88px; }
    .social .stories img { height: 270px; border-radius: 28px; }
    .social .stories figcaption { margin-top: 14px; }
    .social .stories b { font-size: 26px; color: var(--muted); }
    .social footer, .message footer { margin-top: auto; }
    .social .promise { font-size: 22px; }
    .social .terms { margin-top: 10px; font-size: 15px; }

    /* ---------- Message: 1200 × 630, for chats, emails and the link's preview ---------- */
    .message .sheet { width: 1200px; height: 630px; padding: 42px 56px 36px; }
    .message .top { height: 66px; }
    .message .brand { gap: 16px; }
    .message .mark { height: 66px; }
    .message .wordmark { font-size: 34px; }
    .message .school { gap: 14px; }
    .message .school-name { font-size: 15px; }
    .message .crest { height: 58px; }
    .message .body { flex: 1 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 330px; align-items: center; gap: 40px; padding: 10px 0; }
    .message .hero { text-align: left; }
    .message h1 { font-size: 86px; }
    .message .price { margin-top: 22px; font-size: 34px; }
    .message .url { margin-top: 26px; font-size: 40px; text-align: left; color: var(--purple); }
    .message .scan-label { font-size: 22px; margin-bottom: 8px; }
    .message .scan .qr { width: 330px; height: 330px; }
    .message .promise { font-size: 18px; }

    /* ---------- On screen: the sheet scaled to fit, a switch between formats and the file to download ---------- */
    .tools { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; background: rgba(237, 237, 240, .92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: #dcdce3; }
    .seg a { padding: 7px 12px; border-radius: 8px; color: var(--ink); font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; }
    .seg a[aria-current="page"] { background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
    .tools .save { padding: 10px 16px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; line-height: 1; text-decoration: none; white-space: nowrap; }
    .stage { display: flex; justify-content: center; overflow: hidden; padding: 20px 16px 56px; }
    .frame { flex: none; }
    .stage .sheet { box-shadow: 0 10px 40px rgba(0, 0, 0, .12); }
    body.render { background: #fff; }
    body.render .tools { display: none; }
    body.render .stage { display: block; padding: 0; }
    body.render .sheet { box-shadow: none; }

    @page { size: A3; margin: 0; }
    @media print {
      html, body { background: #fff; }
      .tools { display: none !important; }
      .stage { display: block; padding: 0; overflow: visible; }
      .frame { width: auto !important; height: auto !important; }
      .sheet { transform: none !important; box-shadow: none !important; break-after: avoid; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
  <style id="page-size"></style>
</head>
<body>
  <nav class="tools" aria-label="Formats">
    <span class="seg"><a href="?f=a3">A3</a><a href="?f=a4">A4</a><a href="?f=social">Social</a><a href="?f=message">Message</a></span>
    <a class="save" id="save" href="/a3">Download</a>
  </nav>

  <div class="stage">
    <div class="frame">
      <div class="sheet">

        <header class="top">
          <div class="brand">
            <img class="mark" src="assets/preslink-mark.svg?v=4" alt="">
            <div class="wordmark">PresLink <span>Arcade</span></div>
          </div>
          <div class="school">
            <div class="school-name">Presentation Brothers College</div>
            <img class="crest" src="assets/crest.jpg" alt="Presentation Brothers College crest">
          </div>
        </header>

        <div class="body">
          <section class="hero">
            <h1><span id="h1a">Play. Win prizes.</span><br><span class="g">Fund a school.</span></h1>
            <p class="price">€2 a go</p>
            <p class="url only-message">preslink.netlify.app</p>
          </section>

          <section class="scan">
            <p class="scan-label" id="scan-label">Scan to play</p>
            <div class="qr" id="qr" role="img" aria-label="QR code for PresLink Arcade"></div>
            <p class="url only-print">preslink.netlify.app</p>
          </section>
        </div>

        <section class="stories">
          <figure>
            <img src="assets/photo-bikes.jpg" alt="Students with bicycles" style="object-position: 50% 25%">
            <figcaption><b>Bikes to school</b></figcaption>
          </figure>
          <figure>
            <img src="assets/photo-babies.jpg" alt="Mother of Mercy Babies Home" style="object-position: 50% 55%">
            <figcaption><b>Care for babies</b></figcaption>
          </figure>
          <figure>
            <img src="assets/photo-classrooms.jpg" alt="A new classroom in Ghana" style="object-position: 62% 50%">
            <figcaption><b>New classrooms</b></figcaption>
          </figure>
        </section>

        <footer class="foot">
          <p class="promise">Every cent after card fees goes to schools in Ghana and Nigeria.</p>
          <p class="terms" id="terms"></p>
        </footer>

      </div>
    </div>
  </div>

  <script src="vendor/qrcode.js"></script>
  <script>
    (function () {
      'use strict';
      var TILE = "<g transform=\"translate(11.73 0) scale(0.08)\"><defs><clipPath id=\"qr-left\"><rect x=\"-3000\" y=\"-3000\" width=\"3000\" height=\"6000\"/></clipPath><clipPath id=\"qr-right\"><rect x=\"0\" y=\"-3000\" width=\"3000\" height=\"6000\"/></clipPath></defs><g transform=\"translate(633.2 422.52) scale(0.51) rotate(30)\"><path d=\"M -372 -301.5 V 301.5 M 372 -301.5 V 301.5\" fill=\"none\" stroke=\"#f2ea5f\" stroke-width=\"240\"/><path d=\"M -372 -300 A 372 372 0 0 1 372 -300\" fill=\"none\" stroke=\"#c33b29\" stroke-width=\"240\" /><path d=\"M 372 300 A 372 372 0 0 1 -372 300\" fill=\"none\" stroke=\"#5cb73b\" stroke-width=\"240\" /><g clip-path=\"url(#qr-left)\"><path d=\"M -372 750 A 372 372 0 0 1 372 750\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"272\" /></g><path d=\"M -372 750 A 372 372 0 0 1 372 750\" fill=\"none\" stroke=\"#8a219d\" stroke-width=\"240\" /><path d=\"M 372 1350 A 372 372 0 0 1 -372 1350\" fill=\"none\" stroke=\"#141414\" stroke-width=\"240\" /><rect x=\"-492\" y=\"750\" width=\"240\" height=\"600\" fill=\"#ffffff\" stroke=\"#141414\" stroke-width=\"22\" stroke-linejoin=\"miter\"/><rect x=\"252\" y=\"750\" width=\"240\" height=\"600\" fill=\"#ffffff\" stroke=\"#141414\" stroke-width=\"22\" stroke-linejoin=\"miter\"/><g clip-path=\"url(#qr-right)\"><path d=\"M 372 300 A 372 372 0 0 1 -372 300\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"272\" /><path d=\"M -372 -301.5 V 301.5 M 372 -301.5 V 301.5\" fill=\"none\" stroke=\"#f2ea5f\" stroke-width=\"240\"/><path d=\"M -372 -300 A 372 372 0 0 1 372 -300\" fill=\"none\" stroke=\"#c33b29\" stroke-width=\"240\" /><path d=\"M 372 300 A 372 372 0 0 1 -372 300\" fill=\"none\" stroke=\"#5cb73b\" stroke-width=\"240\" /></g><polygon points=\"0,-347 44.7,-227.5 172.1,-221.9 72.3,-142.5 106.4,-19.6 0,-90 -106.4,-19.6 -72.3,-142.5 -172.1,-221.9 -44.7,-227.5\" fill=\"#141414\"/></g></g>";
      var SITE = 'https://preslink.netlify.app/';
      var FORMATS = {
        a3: { cls: 'print', tag: 'a3', page: 'A3' },
        a4: { cls: 'print a4', tag: 'a4', page: 'A4' },
        social: { cls: 'social', tag: 'social' },
        message: { cls: 'message', tag: 'msg' },
      };
      var params = new URLSearchParams(location.search);
      var f = FORMATS[params.get('f')] ? params.get('f') : 'a3';
      var fmt = FORMATS[f];
      var honours = params.get('mode') === 'honours';
      var closes = (params.get('closes') || '').trim().slice(0, 40);
      var org = (params.get('org') || '').trim().slice(0, 120);
      document.body.className = fmt.cls + (params.has('render') ? ' render' : '');
      document.getElementById('page-size').textContent = fmt.page ? '@page { size: ' + fmt.page + '; margin: 0; }' : '';
      Array.prototype.forEach.call(document.querySelectorAll('.seg a'), function (a) { if (a.getAttribute('href') === '?f=' + f) a.setAttribute('aria-current', 'page'); });
      var save = document.getElementById('save'), label = { a3: 'A3', a4: 'A4', social: 'Social', message: 'Message' }[f];
      save.href = '/' + f;
      save.setAttribute('download', 'PresLink-Arcade-' + label + (fmt.page ? '.pdf' : '.png'));
      document.title = 'PresLink Arcade poster · ' + label;

      // Each format keeps only its own pieces: the code is for paper and messages, the photos for paper and posts.
      var drop = function (sel) { Array.prototype.forEach.call(document.querySelectorAll(sel), function (el) { el.remove(); }); };
      if (f === 'social') { drop('.qr, .only-message'); document.getElementById('scan-label').textContent = 'Play now at'; document.querySelector('.scan').appendChild(document.querySelector('.only-print')); }
      else if (f === 'message') drop('.stories, .terms, .only-print');
      else drop('.only-message');
      // The print sheets and posts keep the code in the main column; the message sets the words beside it.
      if (f !== 'message') { var body = document.querySelector('.body'); while (body.firstChild) body.parentNode.insertBefore(body.firstChild, body); body.remove(); }

      if (honours) document.getElementById('h1a').textContent = 'Play. Top the board.';
      var terms = document.getElementById('terms');
      if (terms) {
        terms.textContent = '€2 a go, 3 for €5, 7 for €10. ' + (honours ? 'The top scores are honoured when the game closes' : 'Prizes for the top scores when the game closes')
          + (closes ? ' on ' + closes : '') + '. Under 18s need a parent’s or guardian’s permission to pay. '
          + 'Run by PresLink, Presentation Brothers College, Cork' + (org ? ', under ' + org : '') + '. Terms at preslink.netlify.app';
      }

      // ---- The QR code, as inline SVG ----
      // Error correction H (30 %), so the centre tile and the rounded modules stay well inside what a reader can
      // repair. The SVG carries its own four-module quiet zone (ISO/IEC 18004), so nothing printed beside the code
      // can crowd it. The finder patterns are only lightly rounded, so the 1:1:3:1:1 ratio readers look for survives.
      var box = document.getElementById('qr');
      if (box) {
        var url = SITE + '?r=' + fmt.tag;
        var INK = '#1c1c1e';
        var qr = qrcode(0, 'H');
        qr.addData(url);
        qr.make();
        var n = qr.getModuleCount(), quiet = 4, size = n + quiet * 2;
        var num = function (v) { return (Math.round(v * 1000) / 1000).toString(); };
        // The centre tile: about a fifth of the code, whole modules, centred on the grid.
        var k = Math.round(n * 0.21);
        if ((k % 2) !== (n % 2)) k += 1;
        var first = (n - k) / 2, tx = first + quiet;
        var inFinder = function (r, c) { return (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7); };
        var underTile = function (r, c) { return r >= first && r < first + k && c >= first && c < first + k; };
        var out = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="geometricPrecision">', '<rect width="' + size + '" height="' + size + '" fill="#fff"/>', '<g fill="' + INK + '">'];
        for (var r = 0; r < n; r++) {
          for (var c = 0; c < n; c++) {
            if (!qr.isDark(r, c) || inFinder(r, c) || underTile(r, c)) continue;
            out.push('<rect x="' + (c + quiet) + '" y="' + (r + quiet) + '" width="1" height="1" rx="0.3"/>');
          }
        }
        var finder = function (x, y) {
          out.push('<rect x="' + x + '" y="' + y + '" width="7" height="7" rx="1.2" fill="' + INK + '"/>');
          out.push('<rect x="' + (x + 1) + '" y="' + (y + 1) + '" width="5" height="5" rx="0.9" fill="#fff"/>');
          out.push('<rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3" rx="0.5" fill="' + INK + '"/>');
        };
        finder(quiet, quiet); finder(quiet + n - 7, quiet); finder(quiet, quiet + n - 7);
        out.push('</g>');
        // the centre tile: the PresLink mark, inline so it always prints
        out.push('<rect x="' + num(tx) + '" y="' + num(tx) + '" width="' + num(k) + '" height="' + num(k) + '" rx="' + num(k * 0.18) + '" fill="#fff"/>');
        var cw = k * 0.8, cx = tx + (k - cw) / 2;
        out.push('<g transform="translate(' + num(cx) + ' ' + num(cx) + ') scale(' + num(cw / 100) + ')">' + TILE + '</g>');
        out.push('</svg>');
        box.innerHTML = out.join('');
        box.setAttribute('data-url', url);
      }

      // ---- On screen: shrink the sheet to the window ----
      var sheet = document.querySelector('.sheet'), frame = document.querySelector('.frame');
      function fit() {
        if (document.body.classList.contains('render')) return;
        sheet.style.transform = '';
        var w = sheet.offsetWidth, h = sheet.offsetHeight;
        var s = Math.min(1, (document.documentElement.clientWidth - 32) / w);
        sheet.style.transform = s < 1 ? 'scale(' + s + ')' : '';
        frame.style.width = Math.round(w * s) + 'px';
        frame.style.height = Math.round(h * s) + 'px';
      }
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('beforeprint', function () { sheet.style.transform = ''; frame.style.width = ''; frame.style.height = ''; });
      window.addEventListener('afterprint', fit);
    })();
  </script>
</body>
</html>
