# Supabase's free plan pauses a project that sees little use for a week, and a paused project stops the game
# until someone clicks Resume in the dashboard. Once a day this asks the database for the public total and the
# leaderboard, the same two requests every visit to the site makes, so the project always counts as in use.
# The address and the publishable key are read from site/config.js (both are public by design).
# GitHub turns off scheduled workflows in a repository with no commits for 60 days; a push, or "Run workflow"
# on the Actions tab, turns this back on.
name: Keep the database awake

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ask for the total raised and the leaderboard
        run: |
          URL=$(sed -n 's/.*SUPABASE_URL: *"\([^"]*\)".*/\1/p' site/config.js)
          KEY=$(sed -n 's/.*SUPABASE_KEY: *"\([^"]*\)".*/\1/p' site/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "No server in site/config.js: nothing to keep awake."; exit 0; fi
          for fn in stats board; do
            curl -fsS --retry 3 --retry-delay 20 -X POST "$URL/rest/v1/rpc/$fn" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' -o /dev/null -w "$fn: %{http_code}\n"
          done
